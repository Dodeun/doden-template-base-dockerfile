name: Deploy a tagged release to the VPS

# Tag-triggered (ADR-0008). Merging to `main` publishes an image and deploys
# nothing; pushing `v1.2.0` deploys it. That is what lets several merged
# features be batched into one release, and it is what makes the tag - not the
# tip of a branch - the name of what is in production.
#
# `workflow_dispatch` is the manual escape hatch and takes the tag as an
# input. It is also **the rollback path**: name an older tag and the release
# it points at goes back out, because build.yml never overwrites an image. A
# rollback restores behaviour, not data: migrations only go forward, which is
# why the database Add-on requires expand/contract (docs/addons/database.md).
#
# **A rollback is dispatched from `main`**, with the older tag as its input
# (decision 69). What runs is this file and the two scripts it calls, from the
# revision dispatched; what is sent is the older Release's own Compose file
# and Manifest, from a checkout of its tag. Not dispatched from the tag: a
# tag's copy of this file is whatever deployed then, and one older than
# prod-deploy asks for secrets that no longer exist, so it fails before it
# reaches the host. prod-deploy accepts an older Release, root image included,
# as long as its Manifest declares what it reads.
#
# **The deploy sends data, never a script** (ADR-0016). This Project's key,
# VPS_DEPLOY_KEY, runs one command on production, as the `deploy` user:
# `prod-deploy <slug> <appHost>`, both written into the key's line in
# authorized_keys. deploy/prod-request.sh builds the one document that command
# reads on stdin. What the host does with it - a sandboxed render of the
# Compose file, an allow-list, the Postgres pre-flight, the migration,
# `up --wait` - is in prod-deploy's header, in Dodeun/doden-infra.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy, e.g. v0.1.0. An older tag is a rollback: dispatch it from main.'
        required: true
        type: string

# `packages: read` is what lets production pull private images: the token
# below is this job's own GITHUB_TOKEN, carried in the request and expiring
# when the job ends. Nothing registry-shaped is stored on the host.
permissions:
  contents: read
  packages: read

# One deploy at a time. Two tags pushed a minute apart would otherwise race on
# the host, and the winner would be whichever `docker compose up -d` finished
# last rather than whichever release was chosen. Not cancel-in-progress, so
# the running deploy finishes instead of being killed halfway through a
# migration. Note the limit: GitHub holds exactly one *pending* run per group,
# so if a third is queued while one runs, it supersedes the one waiting. Two
# releases and a rollback in the same minute need the third re-dispatched.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify the release
    runs-on: ubuntu-latest
    steps:
      # `inputs.tag` is the empty string on a tag push, so this picks the
      # dispatch input when there is one and the pushed tag otherwise.
      #
      # The shape is validated because `on.push.tags` filters only the push
      # path and the dispatch input is free text. It is validated with a
      # character class rather than a `v*` glob for a second reason: a value
      # containing a newline passes `v*` and would then write a second line
      # into $GITHUB_OUTPUT, letting the dispatcher set step outputs this job
      # never declared.
      - name: Name the release being deployed
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "::error::'$RELEASE_TAG' is not a release tag (expected v<number>...)"; exit 1 ;;
          esac
          case "$RELEASE_TAG" in
            *[!A-Za-z0-9.+_-]*) echo "::error::release tag has characters a git tag cannot"; exit 1 ;;
          esac
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      # Two checkouts. This one, at the root, is the revision this run was
      # started from: the tag on a push, `main` on a rollback. The scripts
      # that run - deploy/prod-request.sh and deploy/assert-release.sh - come
      # from here, so a rollback to a Release older than them still has them.
      - uses: actions/checkout@v7

      # This one, in release/, is the Release, and the only copy of it in the
      # chain. It resolves the tag to a commit - failing here, on the runner,
      # when a dispatch names a tag that does not exist, rather than on the
      # host halfway into a deploy - and it is where the two descriptors sent
      # to the host come from: a rollback sends that Release's own Compose
      # file and Manifest. The host has no clone to read them from and no
      # credential to fetch one with (ADR-0011).
      # `fetch-depth: 0` is for the step below and for nothing else: a
      # merge-base needs the commit graph, and the default checkout fetches
      # one commit of it.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.release.outputs.release_tag }}
          path: release
          fetch-depth: 0

      # The rule that actually says "only reviewed code reaches production".
      #
      # This Project's `refs/tags/v*` ruleset makes an existing tag immutable,
      # so a tag cannot be *moved* onto a hostile commit. Creating one has to
      # stay open - tagging a release is the operator's deliberate act
      # (ADR-0008) - so a leaked token carrying `contents: write` can still
      # put a *new* tag on a commit that went through no pull request, and
      # immutability would faithfully preserve it. The ruleset closes less
      # than it looks like it closes, and this is the residue.
      #
      # What closes it is asking where the commit came from rather than what
      # the tag is called. The `protect-main` ruleset is the one control that
      # survives a leaked token, so a commit that is an ancestor of `main` has
      # been through it - a pull request, the suite, the contract check - and
      # a commit that is not has been through nothing.
      #
      # Both halves are needed and neither is redundant: measured on the
      # platform's first Project, a tag ruleset carrying `deletion` and
      # `non_fast_forward` but not `update` still lets a release tag be moved
      # forward onto any descendant commit.
      #
      # The branch is read off the event rather than written here, for the
      # same reason `protect-main` targets `~DEFAULT_BRANCH` rather than the
      # literal: a check naming a branch that a rename has removed is a check
      # that has stopped checking, and nothing says so. It is required rather
      # than defaulted, because an empty value would fetch nothing and then
      # compare against whatever FETCH_HEAD happened to be holding.
      #
      # The branch is fetched here rather than assumed to be sitting in
      # refs/remotes: which refs a tag checkout leaves behind is an
      # implementation detail of the action, and a check that reads a ref
      # which might not exist fails open on the day it matters.
      - name: Refuse a release that never reached main
        working-directory: release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # No apostrophe in the word below, for the reason the Manifest step
          # states at length: bash parses it with its own quoting rules.
          : "${DEFAULT_BRANCH:?the event payload names no default branch, so this step cannot say what has been reviewed}"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::${RELEASE_TAG} points at $(git rev-parse HEAD), which is not an ancestor of ${DEFAULT_BRANCH}. Only reviewed code reaches production: tag a commit that has been merged. Nothing was sent to the host and production is on the release it was on."
            exit 1
          fi

      # Read out of the checkout of the release, so the deploy is described by
      # the Manifest that shipped with it: the hostname the last step asks,
      # from the same `appHost` the images were built with. The slug, the
      # hostname and the database Add-on reach the host inside the Manifest
      # itself, which prod-request.sh checks and prod-deploy reads.
      #
      # ADR-0010 is why this is a committed file rather than a repository
      # variable - an agent whose scope is this repository can open it and say
      # where this Project deploys. `// empty` plus `:?` is what makes a
      # missing field a failed step instead of an empty string.
      - name: Read the identity of the Project from the Manifest
        id: manifest
        working-directory: release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          if [ ! -f platform.json ]; then
            echo "::error::${RELEASE_TAG} ships no platform.json, so it predates the Manifest, and production deploys from one. This workflow cannot put such a release back."
            exit 1
          fi
          PROJECT_SLUG="$(jq -r '.slug // empty' platform.json)"
          APP_HOST="$(jq -r '.appHost // empty' platform.json)"
          # No apostrophe in either message below: bash parses the word of
          # ${VAR:?word} with its own quoting rules, so one would open a quote
          # that never closes and kill the step before jq ran.
          # scripts/check-shell.sh parses every block in these files for this.
          : "${PROJECT_SLUG:?platform.json declares no slug - the Project this deploy names, and the one its key is pinned to}"
          : "${APP_HOST:?platform.json declares no appHost - the public hostname this release is deployed under}"
          # These two reject characters, and that is the whole of what they
          # claim. They are NOT a second definition of a valid slug or a valid
          # hostname - platform.schema.json owns that, and the
          # `contract / tier-1` check enforces it on every pull request.
          #
          # What they are is an injection guard, which is a different question
          # the schema does not answer for this job: both values are written
          # to $GITHUB_OUTPUT, where a newline sets step outputs this job
          # never declared. The ancestor check above says the commit was
          # reviewed, not that every value in a reviewed file is safe to
          # write there.
          case "$PROJECT_SLUG" in
            *[!a-z0-9-]*)
              echo "::error::the slug in platform.json has characters a Compose project name and a path cannot: $PROJECT_SLUG"; exit 1 ;;
          esac
          case "$APP_HOST" in
            *[!a-z0-9.-]*)
              echo "::error::the appHost in platform.json has characters a hostname cannot: $APP_HOST"; exit 1 ;;
          esac
          echo "Deploying ${PROJECT_SLUG} ${RELEASE_TAG} to ${APP_HOST}"
          {
            echo "slug=$PROJECT_SLUG"
            echo "app_host=$APP_HOST"
          } >> "$GITHUB_OUTPUT"

      # Images are tagged with the commit SHA, never with the release tag:
      # build.yml runs on the merge, before any tag exists. So deploying
      # `v0.1.0` means pulling the images published for the commit `v0.1.0`
      # points at. `git rev-parse HEAD` peels an annotated tag for us.
      - name: Resolve the tag to the commit its images were published under
        id: image
        working-directory: release
        run: echo "image_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Derived the same way build.yml derives it, from the same
      # `github.repository`, so the registry path has one source of truth
      # instead of a literal repeated in the Compose file. The host derives
      # its own from the key's slug, and refuses a request naming another.
      - name: Derive the registry path
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE_REPO_PREFIX=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"

      # The key and the host key are written to files only this runner's user
      # can read, and the request goes in on stdin: nothing secret reaches an
      # argument list, and the registry token is read from the environment by
      # prod-request.sh and by nothing else. `StrictHostKeyChecking=yes`
      # against VPS_KNOWN_HOSTS, so the first connection trusts nothing it was
      # not told to: a runner that trusted whatever answered at VPS_HOST would
      # hand it the registry token. The same lines as build.yml's lab-deploy.
      # Not appleboy/scp-action and ssh-action: third-party code on a moving
      # tag, handed the key in clear (decision 67).
      #
      # The request is built whole before a connection opens, so a refusal
      # sends nothing. The host's exit status is the deploy's verdict, and ssh
      # passes it through: 1 is prod-deploy refusing or failing, and says why.
      # **255 is ssh's own failure**, and a deploy is never retried on it: the
      # connection may have broken after the request went, and a deploy is
      # never run twice by a retry. ServerAliveInterval, because prod-deploy
      # can be silent for minutes - waiting on another deploy's lock, or on a
      # first certificate - and a connection that quiet can be dropped by a
      # NAT on the way.
      - name: Send the deploy request to production
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          IMAGE_TAG: ${{ steps.image.outputs.image_sha }}
          # Registry credential for the pull. Ephemeral by construction.
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -o pipefail
          : "${VPS_HOST:?the VPS_HOST secret is not set - project new sets it, with the two below}"
          : "${VPS_DEPLOY_KEY:?the VPS_DEPLOY_KEY secret is not set - the key that can deploy this Project and nothing else}"
          : "${VPS_KNOWN_HOSTS:?the VPS_KNOWN_HOSTS secret is not set - the host key of production}"
          # A host name or an address, and never something ssh would read as
          # an option.
          case "$VPS_HOST" in
            -*|*[!A-Za-z0-9.-]*)
              echo "::error::VPS_HOST has characters a host name cannot"; exit 1 ;;
          esac
          key="$RUNNER_TEMP/vps_deploy_key"
          known="$RUNNER_TEMP/vps_known_hosts"
          (
            umask 077
            printf '%s\n' "$VPS_DEPLOY_KEY" > "$key"
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known"
          )
          # Its refusal, if any, is on stderr above, and nothing was sent.
          request="$(bash deploy/prod-request.sh release)"
          # `deploy` is what the client asks for. The host runs its forced
          # command whatever is asked, and never reads it.
          status=0
          printf '%s\n' "$request" |
            ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
              -o ServerAliveInterval=30 \
              "deploy@${VPS_HOST}" deploy || status=$?
          unset request
          if [ "$status" -eq 255 ]; then
            echo "::error::ssh itself failed (exit 255): the connection, the key VPS_DEPLOY_KEY or the host key VPS_KNOWN_HOSTS, as its message above says. Not retried. If the connection broke after the request went, the host may have deployed: ask /api/health which release answers before running this again."
          fi
          exit "$status"

      # The only check in this chain that tests the path a user actually
      # takes: DNS, Traefik, the router rule, into the Service that answers
      # it. From the runner rather than from the host, because the host
      # curling its own public hostname depends on hairpin NAT, and the runner
      # is where the real path starts anyway.
      #
      # A script rather than ten lines of YAML so that it can be run by hand
      # against a host that should fail it, which is the only way to know a
      # check works. Its header says how. The dispatched revision's copy,
      # from the root checkout.
      - name: Assert the release is answering on the public URL
        env:
          APP_HOST: ${{ steps.manifest.outputs.app_host }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: bash deploy/assert-release.sh
